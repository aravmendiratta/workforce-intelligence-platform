version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - .:/app
    
  frontend:
    build: .
    ports:
      - "8501:8501"
    command: streamlit run streamlit_app.py
    volumes:
      - .:/app
    depends_on:
      - api
